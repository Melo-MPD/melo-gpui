[package]
name = "melo"
version = "0.1.0"
edition = "2024"
description = "Melo for Mac — a native macOS MPD client built with GPUI"
license = "MIT"
publish = false

[[bin]]
name = "melo"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
mdns-sd = "0.13"
anyhow = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
block = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
